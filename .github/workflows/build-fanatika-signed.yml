name: Build signed Fanatika release APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Fanatika source checks
        run: python3 -m unittest tests_sleep_source tests_fanatika_remote_ui tests_fanatika_v23 tests_fanatika_v24 tests_fanatika_v25 tests_fanatika_v26 tests_fanatika_v27 tests_fanatika_v271 tests_fanatika_v28
      - name: Verify signing secrets (no secrets are logged)
        env:
          KEY_B64: ${{ secrets.FANATIKA_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.FANATIKA_STORE_PASSWORD }}
          ALIAS: ${{ secrets.FANATIKA_KEY_ALIAS }}
          ALIAS_PASS: ${{ secrets.FANATIKA_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEY_B64" || -z "$KEY_PASS" || -z "$ALIAS" || -z "$ALIAS_PASS" ]]; then
            echo 'Missing signing secrets. See SIGNING_AND_UPDATING.md.' >&2
            exit 1
          fi
          printf '%s' "$KEY_B64" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK using private signing key
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.FANATIKA_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.FANATIKA_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.FANATIKA_KEY_PASSWORD }}
        run: flutter build apk --release --flavor github --target-platform android-arm
      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fanatika-TV-Launcher-signed-release
          path: build/app/outputs/flutter-apk/*release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Clean temporary signing key
        if: ${{ always() }}
        run: rm -f android/app/upload-keystore.jks
